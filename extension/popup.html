<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Light Torrent</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header><img src="icons/icon-48.png" width="36" height="36" alt=""><h1>Light Torrent</h1></header>
  <p>Approve magnet links on websites to download them locally.</p>
  <div class="controls">
    <button id="open-downloads" type="button">Open downloads</button>
    <button id="change-folder" class="secondary" type="button">Change final folder</button>
  </div>
  <p id="status" role="status" aria-live="polite">The client starts automatically when needed.</p>
  <footer><a href="https://github.com/Alefalsa/light-torrent/blob/main/extension/README.md" target="_blank" rel="noopener noreferrer">Setup and troubleshooting</a></footer>
</body>
</html>
